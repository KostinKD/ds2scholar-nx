# ReXGlue recompilation manifest for Dark Souls II: Scholar of the First Sin (Xbox 360, title 465307E4, Default.xex,
# disc version, no title update).
#
# Run tools/codegen.ps1: it calls `rexglue codegen ds2_manifest.toml` and the post-codegen steps. The project name
# sets the prefix of everything generated: generated/default/ds2_{init,pch,funcs}.h, ds2_recomp.N.cpp.
#
# Default.xex: image base 0x82000000, entry point 0x829C3DE0, image size 0x016F0000, XEX version 0.0.0.22, media id
# 458B3E06
# (docs/analysis/xex.md).

[project]
name = "ds2"
sdk_version = "0.10.0"
# Your own game files: the extracted GoD package (assets/game_root, made by tools/god_extract.py), with Default.xex
# at its root. Nothing from the game is distributed with this project.
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/Default.xex"
out_directory_path = "generated/default"

#   overrides.toml       written by hand: code the automatic function discovery misses, each with its evidence
#   switch_tables.toml   written by hand: jump tables the generator gets wrong (tools/switch_check.py --toml)
#   codegen_flavor.toml  the codegen flavour, written by tools\codegen.ps1 -Flavor
includes = ["overrides.toml", "switch_tables.toml", "codegen_flavor.toml"]

# No [[modules]]: the game's only XexLoadImage call (0x829D0098, in the wrapper 0x829D0080) is reached from two
# callers that pass "xboxkrnl.exe" (0x829F1560) and "xam.xex" (0x82C6597C): system modules only
# (docs/analysis/xex.md, "Дополнительные .xex-модули").
