# Dark Souls II: Scholar of the First Sin-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (the address, who calls it or where the pointer is stored, which tool or log found
# it). Started empty on 2026-10-21: the DS2 TU0 version (1090 lines, git 767a1256:app/overrides.toml) has DS2
# addresses and is only a hint (docs/porting-from-ds2.md).

# The CRT's setjmp/longjmp (root keys: they must stay outside any table); the generator emits host setjmp/longjmp
# keyed by the guest jmp_buf instead of plain calls, which would return into a foreign stack frame.
# Found 2026-10-21 by the masked byte signature of DS2's pair (branch displacements, addi/addis immediates and
# load/store displacements masked; DS2 0x82FB8A30-0x82FB8CF8 and 0x82FB78D0-0x82FB7BE0, docs/ds2-nx/analysis/codegen.md):
# each DS2 range matches exactly one place in SotFS.
#   setjmp  0x82FED7E0 (178 words): the same shape, hook check lis r4,0x8367; lwz r0,0x4C98(r4) (= 0x83674C98; DS2
#           0x836439D8); cmpwi; mtctr; bnectr; mflr ... 70 direct callers (first 0x822545F4, 0x824367F8, 0x8243C7CC;
#           DS2 68).
#   longjmp 0x82FEC680 (196 words, .pdata start, 0x314 bytes like DS2): 430 direct callers (first 0x82241C2C,
#           0x82699E0C, 0x826A0CCC; DS2 430).
setjmp_address = 0x82FED7E0
longjmp_address = 0x82FEC680

