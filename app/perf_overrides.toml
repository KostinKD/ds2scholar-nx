# Code generation options for speed: the "optimised codegen" flavour (tools\codegen.ps1 -Flavor optimised copies this
# file to codegen_flavor.toml, which ds2_manifest.toml includes; -Flavor classic writes an empty one). Root keys: they
# must stay outside any table. Build-time options: each set is an NRO of its own, A/B against the classic one.
#
# SotFS (2026-10-21, branch cpu-optimised): ds2-nx's final configuration (its app/perf_overrides.toml, git 767a1256,
# entries 42-62 of docs/ds2-nx/progress.md explain each option), rebuilt for SotFS. The options without per-function
# marks carry over as they are; the keep lists are SotFS's own (audits below), not DS2's addresses.
# Console baseline (classic, no LTO, 2026-10-21 docs/progress.md entry 10): 22-43 fps, CPU 213-340 % of 400 %, GPU idle
# ("gap") ~12 ms per frame waiting for the CPU.
#
# Step 1 (ds2-nx entry 42, from sa2-nx): cr0-cr7, ctr, xer and the lwarx reservation as C++ locals; skip_msr;
# dform_disp_split; fctiwz/fcti/div inline; fewer host flush-mode switches. Known risk (as DS2): the guest setjmp
# (0x82FED7E0) - after a longjmp the CR locals of the setjmp caller keep the values of the failing call.
# Post-codegen steps (ds2-nx entries 51 and 62): no_volatile (tools/pch_no_volatile.py + tools/loop_barriers.py; the
# XDK memcpy sub_829C7FF4 kept volatile and without barriers by tools/keep_volatile.py / NO_BARRIER, and native with
# ds2_native_unaligned_memcpy) and direct_calls (tools/direct_calls.py). The keep lists below were audited with these
# steps off (logs/rbw_nonvolatile1-3.log, nonarg_audit1.log, nonarg_audit_with1.log: HANDOVER 0).
# ds2: post_codegen only: no_volatile, direct_calls
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fp_moves_modeless = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = false
fcti_inline = true
fp_copy_pairs = true
div_inline = true
# ds2-nx kept the return-address stores (owner's decision 2026-10-18).
elide_lr_stores = false
# ds2-nx entry 59: r14-r31, f14-f31, v14-v31/v64-v127 as C++ locals. Keep list: tools/read_before_write.py on SotFS code
# generated with the option, noreturn seeds 8269B380 (assert failure; ds2-nx 8266B030, its callee
# 8266AF90 -> 8269B2E0), 82FEC680 (longjmp), 82FEDC70 (_invoke_watson; ds2-nx 82FB8EC0), 82FF45D0
# (_CxxThrowException; ds2-nx 82FBF820), each the only masked-signature match.
non_volatile_as_local = true
