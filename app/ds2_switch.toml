# ds2scholar-nx settings (started from ds2-nx) for the Switch: copied to sdmc:/switch/ds2scholar-nx/ds2.toml by tools\win\package_switch.ps1.
# Stage 5, first NRO (2026-10-17): diagnostic settings for the first boots on the console.

# The native Vulkan renderer (the only one on the Switch; also its default there).
sa2_renderer_native = true

# The game data is a loose game_root folder next to the NRO: 121 files, 5.8 GB, the largest 2.8 GB. One pack would be
# a 5.8 GB file (impossible on FAT32) and the SDK would build it at the first boot (asset_pack_build defaults to true
# on the Switch): off.
asset_pack_build = false

# First boots: a log file next to the NRO (logs/), the frame count every 5 s.
log_level = "info"
log_to_file = true
ds2_swap_log_s = 5

# Stage 5 (2026-10-17): sa2's sampler caches kept across frames left a stale texture after a new game's prologue: the
# Things Betwixt sky came out white (console: "very white glow"; PC native: the same, the emulated GPU purple). With
# the caches per frame the sky matches the emulated GPU (A/B on the PC, out/userdata_newgame5). Root cause not found
# yet (docs/progress.md, entry 20).
sa2_native_cache_textures_between_frames = false

# Low frame rate at the waking scene (console, 2026-10-17: ~5 fps, the CPU waiting on GPU fences): GPU time per pass
# category in the log ("GPU time by pass"), to see which pass costs.
sa2_gpu_marks_categories = true

# Collect the shaders the package lacks while playing (console, 2026-10-17: white grass and transparent faces past the
# start of Things Betwixt, 11 unidentified pixel shaders in the log): written to sdmc:/switch/ds2scholar-nx/shader_misses/
# (discovery/, missing/, variants/), copied back to the PC for the next package.
sa2_shader_misses = "shader_misses"

# Stage 5, frame rate (2026-10-17, run with ds2-nx 5f7df373): with the EDRAM transfers nearly gone the console is
# CPU-bound in play (CPU 280 % of 300 %: GPU ring thread 76 %, game main thread 72 %). Stack samples every 1 ms in
# logs/rex/rex_profile.log, for tools/switch_profile_report.py with out/nx/keep/ds2_5f7df373.elf. Sampling costs some
# frame rate: this run's fps is not a measurement.
# Off again (455c8418's profile is in hand): a run without sampling measures the frame rate.
# On (2026-10-18, busy-wait search): one play run with the step 1 NRO (out/nx/keep/ds2_step1_again.elf); 10 guest
# functions spin with db16cyc (sub_829B9C60, sub_829BCD20, sub_82C22528, ...), the profile says which ones cost.
# Off again (2026-10-18): the busy-wait profile is in hand (docs/progress.md entry 37); this run measures fps.
# On (2026-10-18, entry 48): main-thread profile of the step 1 NRO with the GPU-side keys (out/nx/keep/ds2_zcullv.elf).
# Off again: the main-thread profile is in hand (entry 48).
# On (2026-10-18, entry 53): profile for tools/hot_order.py, recorded on the entry 51 NRO (out/nx/keep/ds2_direct.elf).
# Off again: the hot-order profile is kept in out/nx/keep/profiles/rex_profile_direct_hot.log.
switch_profile_stacks = false

# Stage 5, frame rate (2026-10-17): sa2's expanded-grid depth views for depth-only 4x draws. Dark Souls II only draws
# Direct3D's Clear through the 4x alias (its 800x800 shadow map, twice a frame); with the grid view the clear could not
# be redirected into the shadow map and 500 tiles went back and forth each time. Off: EDRAM depth representation
# switches -31 % in Things Betwixt, -38 % in Majula (PC), image unchanged (Majula mean difference 0.55/255).
sa2_native_depth_samples_x = false

# Stage 5, busy-waits (2026-10-18): the game's D3D GPU wait sub_829B9C60 sleeps until the ring thread makes progress
# instead of spinning (app/src/cpu/ds2_gpu_wait.cpp, the port of sa2-nx's sa2_cpu_gpu_wait_sleep). Console stack
# profile of the step 1 NRO: the hottest function of the game's main thread (8 % self; its caller sub_829A8238 25.8 %
# of the guest stacks).
ds2_cpu_gpu_wait_sleep = true

# Stage 5, GPU (2026-10-18): the depth imports that still took 9 passes (cat 13, ~10 % of GPU time at the bonfire;
# console ds2_001 12:31: 372 imports per 10 s, all with a colour source C000 -> depth 000:800x800 / 000:1040x1040 /
# 0B8:640x720, ~8 tiles each, mostly late stencil fetches for depth->colour exports) go through the copy engine
# (compute + vkCmdCopyBufferToImage(STENCIL)). Those 1x depth views already have TRANSFER_DST (no ZCULL plane,
# sa2_native_zcull_1x_depth = false); only sa2's 32-tile minimum kept them on the masked passes. PC at the bonfire:
# 9-pass imports none, copy-engine 3664 per 10 s; shot difference 0.56/255 (the flames). Console: to be measured
# (each copy adds 3D -> compute -> copy -> 3D switches).
sa2_native_edram4_stencil_copy_min_tiles = 0

# Stage 5, GPU (2026-10-18), measurement: 1x depth views keep their ZCULL plane (no TRANSFER_DST). Their stencil
# imports then go back to the masked passes (copy_stencil needs TRANSFER_DST), so this trades entry 40's copy-engine
# win for ZCULL on the 1x depth views (NVK log: 'SIN plano ... TRANSFER_DST' for 640x720, 800x800, 1040x1040, ...).
# Measured (2026-10-18, entry 41): scene GPU ~2160 -> ~1895 raw ms per 10 s, but the 9-pass imports came back
# (cat 13 ~20 -> ~490) and the long frames' GPU went 44 -> 51 ms: no gain. Back to false (copy-engine imports).
sa2_native_zcull_1x_depth = false

# Stage 5, GPU (2026-10-18, entry 46): ZCULL for the scene depth only (2D0:1280x1280 receives no stencil import);
# the views that do (shadow maps 000:800x800 / 000:1040x1040, half-resolution 0B8 / 658 / 710) keep TRANSFER_DST and
# the copy-engine imports. Entry 41: ZCULL on every 1x depth view made the scene ~12 % faster but brought the 9-pass
# imports back.
# Measured (entry 47): scene ~2090 vs ~2160 raw ms per 10 s (-3 %, within the route noise), fps median 18.5 vs 19.5:
# no gain. Off (empty); the key stays for a later try with the shadow maps.
ds2_zcull_depth_views = ""

# Stage 5, CPU (2026-10-18, entry 49): the XDK's unaligned vector memcpy sub_82997E24 in native code
# (app/src/cpu/ds2_native_memcpy.cpp): GCC 16.1.0 miscompiles the recompiled one whenever its code moves (entries
# 42-44). PC check (sa2_cpu_verify): 1314 calls at the bonfire, 0 differences from the original.
ds2_native_unaligned_memcpy = true
# Stage 5 (2026-10-20, entries 63-64): 30 fps with even pacing, every frame two vblanks (app/src/ds2_frame_cap.cpp).
# Owner's choice for the raised clocks (CPU 1785 / GPU 921.6 / memory 2133): 96.6 % of the frames exactly 33.3 ms.
# L+R+Minus turns it off and on in game. At stock clocks (~20 fps) it may add frames of 66.7 ms (sa2-nx's warning).
ds2_frame_cap_30 = true
# Owner (2026-10-20): face buttons by letter, as in Switch games: the Switch's A acts as A (confirm), B as B (cancel / roll),
# X as X, Y as Y. true (the SDK default) = by position, as on the Xbox 360 pad.
input_xbox_layout = false
# GPU (2026-10-21, entry 75): the second depth resolve of a frame that repeats the first (105B9000, nothing written in
# between) is skipped: console -0.4 ms of GPU per frame (depth resolves 1.3 -> 0.9 ms), picture checked by the owner.
ds2_skip_repeated_depth_resolve = true
# CPU (2026-10-22, docs/progress.md): the redirected depth clear keeps its region list between calls; console A/B
# in Heide's Tower: ring-thread _free_r gone from the profile (3-10 % before), picture the same with the key off.
ds2_redirect_regions_reuse = true

# Render scale option (2026-10-23, docs/progress.md 2026-10-23 (2)): VPOS in guest pixels, needed for any render height
# other than 720 (shader package v8). 1.0 at 720 = the same image as before.
ds2_vpos_render_scale = true
# Option: 960x540 in handheld. Console, Majula bonfire, static: GPU busy ~28.8 -> ~20 ms a frame (scene 12.9 -> 10.1 ms),
# uncapped 35-37 fps (CPU-bound, 277 % of 300 %). Owner: a bit softer, no doubling. Uncomment to use.
# sa2_render_height_handheld = 540
# Docked (TV, or Reverse-NX "Docked" in hand; 2026-10-25, owner): render 1280x720 instead of the default 1920x1080 (2.25x
# the pixels); the presenter's FSR (present_effect below) upscales it to the 1080p output. Docked is not tested yet.
sa2_render_height_docked = 720

# Persistent vertex cache (2026-10-23, docs/progress.md 2026-10-23 (3)): console, Majula 540 uncapped 36.8 -> 37.9 fps,
# ring thread 21.3 -> 19.8 ms a frame, 86 % hits; 720 GPU-bound: same fps, ring 75.7 -> 70.0 %. Owner: no artifacts.
ds2_vertex_cache_mb = 64
# Index cache without its content check (2026-10-23, docs/progress.md 2026-10-23 (5)): the sync epochs already forget
# every range at each GPU-to-game signal. PC verify: 0 stale in 2.65M hits; console 540 uncapped 39.0 -> 39.7 fps.
ds2_indices_cache_fingerprint = 0

# Dynamic resolution (2026-10-23, docs/progress.md 2026-10-23 (11)): handheld 720 -> 540 while the GPU is over 31 ms a frame,
# back when 720 fits; both scales kept (ds2_dynamic_resolution_keep), a switch costs 0.6-6.6 ms. Console forest: GPU
# frames >= 40 ms 24 -> 3. Owner: switches not noticeable. L+R+Plus turns it off and on in game.
ds2_dynamic_resolution = true
# Backoff (2026-10-25, docs/progress.md 2026-10-25 (17)): a drop within 10 s of going back keeps 540 twice as long next
# time (5 -> 10 -> ... -> 80 s), a minute at 720 halves it. Console ds2_107: 8 switches in 3.3 min (ds2_103: 12 in 2 min),
# returns held 54-61 s. Owner: fine.
ds2_dynamic_resolution_backoff = true
# The threshold: GPU time per frame (real ms) above which the picture drops to 540 (after 4 frames in a row); it goes back
# to 720 when 720 is predicted to fit with 2 ms to spare (ratio 1.45, after at least 5 s at 540). At 30 fps a frame has
# 33.3 ms: higher (e.g. 33-36) = drops to 540 less often (less blur / shimmer), but more fps dips in heavy places;
# lower (e.g. 28) = drops sooner, steadier fps. Read at start.
ds2_dynamic_resolution_budget_ms = 31.0

# Work slots (2026-10-24, docs/progress.md 2026-10-24 (2)): 2 instead of 3 - the CPU runs less ahead of the GPU (input
# latency) and 64 MB are freed; console ds2_073: 98.5 % of frames exactly 2 vblank, no loss seen; owner: no difference felt.
# Back to 3 (the default): delete this line or set it to 3. Read at start.
sa2_native_slots_work = 2

# New textures uploaded without hashing; the hash is taken at their first recheck, 2-9 frames later (2026-10-24,
# docs/progress.md 2026-10-24 (3)): console, streaming frames Majula -> forest: hashing 8.8-13.2 -> 0.3-1.2 ms a frame.
# Owner: picture fine; the late tree/bush detail is the game's own streaming (seen with this off too). Read at start.
ds2_texture_lazy_fingerprint = true

# FXAA on the output (2026-10-24, docs/progress.md 2026-10-24 (4)): the output shader's FXAA branch; owner: no visible
# difference, kept on. GPU cost not measured (the output pass is outside the GPU marks). Read at start.
ds2_output_fxaa = true
# FXAA 3.11 Quality instead of the light FXAA (2026-10-25, docs/progress.md 2026-10-25 (16)): owner chose it after
# console play (ds2_105, aa1); edges of posts/branches smoother on the PC shots. Read at start.
ds2_output_fxaa_quality = true

# Upscaler of the presenter (2026-10-25, entries 13-16): FSR 1 (EASU + RCAS) when the frame is 540 (dynamic
# resolution or fixed), RCAS only at 720. Owner chose it; L+R+left stick cycles bilinear / fsr / cas in game.
present_effect = "fsr"

# Fused untiling and byte order of new textures (2026-10-24, docs/progress.md 2026-10-24 (4)): console Majula <-> forest
# (ds2_085), clean streaming frames: untiling 0.61-0.72 ms per MB, all texture work 0.80-1.04 ms per MB (was 1.7-2.0);
# 200 whole textures checked equal against the usual path (then 1 in 64 keeps checking). Read at start.
ds2_texture_fused_untile = true

# Clocks after the HOME menu (2026-10-24, docs/progress.md 2026-10-24 (4)-(5)): with an overclock (Horizon OC profile, CPU
# 1785 / GPU 921.6) the port no longer asks apm for 460.8 MHz (it changed nothing, but HOME brought it back at stock), and
# if the clocks still fall after HOME they are overridden back to the start-of-play ones. The second one has not had
# to act yet (ds2_081/085: the clocks came back by themselves). Read at start.
ds2_gpu_boost_keep_higher = true
ds2_clocks_hold_after_home = true

# Pipeline cache save (docs/progress.md 2026-10-28 (7)-(9)): running out of memory while copying the cache for saving
# postpones the save instead of ending the game (crash ds2_138); no in-memory copy of the ~25 MB cache between saves.
# On the console since 2026-10-28 (pcguard1/pcdrop1 and later).
sa2_native_pipeline_cache_save_guard = true
sa2_native_pipeline_cache_drop_copy = true

# Online and P2P LAN Co-op (docs/xnet-peer-join.md, docs/online-server.md)
net_online_probe = true
net_dns_address = "192.168.1.95"
net_title_server_count = 1
ds2_socket_buffer_endian = true

net_p2p_lan = true
# Experimental session-key isolation; enable only for the repeat-summon A/B.
# net_p2p_session_addresses = true
net_p2p_title_identity = true
net_p2p_diagnostics = true
net_user_name_lookup = true
net_user_name_directory = "B13EBABEBABEBABE=User;B13EBABEBABEBABF=User;B13EBABEBABEBAC0=User;B13EBABEBABEBAC1=User"
net_p2p_address = "192.168.1.76"
net_p2p_peer_address = "192.168.1.95"
net_p2p_peer_xuid = "12771850921608919744" # B13EBABEBABEBAC0, PC test profile
net_p2p_port = 3074
